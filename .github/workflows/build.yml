name: build

# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
# Re-enable via Actions tab or: gh workflow enable build

on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * *'
  push:
    branches:
      - main

permissions: {}

# A scheduled run and a push run both commit to main and deploy the site.
# Overlapping them races the push and loses episodes.
concurrency:
  group: build
  cancel-in-progress: false

# Pinned rather than resolved from HEAD on every run: upstream's last commit is
# from 2023-08-21, so this was a network call that returned the same answer each
# time while leaving the cache key able to shift without warning.
env:
  EBOOK2CW_REF: b4b1fa2debee89c08c5f67040e887e86a5e61f15

jobs:
  build:
    runs-on: ubuntu-24.04
    # A single day is ~6 minutes. The cap only bites on a deep backfill: seven
    # missed days is 42 generate+upload cycles, which blew a 45m cap outright
    # and lost the whole run's work rather than part of it.
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      press_outcome: ${{ steps.press.outcome }}
    steps:
      # Shallow: nothing here reads history, and the archive is 2000+ posts deep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Date Env
        run: echo "TODAY=$(date +%F)" >> $GITHUB_ENV

      # Fully stubbed, so it runs before the toolchain exists and fails in
      # seconds rather than 40 minutes into a backfill.
      - name: Test episode press logic
        run: ./test_episode_press.sh

      - name: Cache ebook2cw binary
        id: cache-ebook2cw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /usr/local/bin/ebook2cw
          key: ebook2cw-${{ runner.os }}-${{ env.EBOOK2CW_REF }}

      # Runtime packages are always needed. The toolchain and -dev headers are
      # only needed to compile ebook2cw, which is cached, so installing them on
      # every run cost ~a minute for nothing.
      # fortunes-min is listed explicitly because it is only a *Recommends* of
      # fortune-mod: --no-install-recommends installs the binary with no data,
      # so `fortune` exits 1 with "No fortunes found" and every episode fails.
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            fortune fortunes-min espeak sox libsox-fmt-all libmp3lame0 libvorbisfile3
          # Gate the data, not just the binary: a silent regression here broke
          # six consecutive days of builds before anyone looked at the log.
          fortune -s > /dev/null

      - name: Install build dependencies
        if: steps.cache-ebook2cw.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install --assume-yes --no-install-recommends \
            build-essential gettext libvorbis-dev libmp3lame-dev

      - name: Build ebook2cw
        if: steps.cache-ebook2cw.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/dj1yfk/ebook2cw.git
          git -C ebook2cw checkout --quiet "$EBOOK2CW_REF"
          # Fix german translation error
          sed -i.bak 's/\(install .*-m 0644 po\/de.mo\)/#\1/' ebook2cw/Makefile
          sudo make --directory=ebook2cw/
          sudo make install --directory=ebook2cw/
          rm -rf ebook2cw

      - name: Press all episodes
        id: press
        continue-on-error: true
        env:
          S3_ACCESS: ${{ secrets.S3_ACCESS }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: ./episode_press.sh 05 10 15 20 25 30

      # Writes the true size/duration of every episode into post front matter.
      # Six HTTP requests total. Self-healing: any post still missing values,
      # including ones whose upload failed earlier, gets them once audio exists.
      - name: Backfill episode metadata
        run: ./backfill_metadata.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      # Gate: fails the run before the artifact is uploaded, so a feed clients
      # would reject never reaches the deploy job.
      - name: Verify feeds
        run: ./verify_feeds.py _site --sample 3

      # Local config, not --global: only this checkout commits anything.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push new posts
        run: |
          git add _posts/*.md
          if ! git diff --staged --quiet; then
            git commit -m "Unattended build"
            git push origin main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Generous on purpose: this job spends its time waiting for a runner and for
    # the Pages API, not burning CPU. A tight cap turns a slow runner assignment
    # into a hard failure -- which is exactly what happened during the GitHub
    # Actions incident of 2026-10-05 (degraded runner assignment), where the job
    # was cancelled having executed zero steps.
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Deliberately a separate job, NOT a step of `build`: a failing step there
  # would make `deploy` skip via `needs:`, so one flaky archive.org upload
  # would stop the site updating. This reports after the deploy has happened.
  report:
    needs: [build, deploy]
    if: always() && needs.build.outputs.press_outcome == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Not "upload failures": this fires on ANY non-zero exit from the press
      # step, and saying "upload" sent six days of debugging in the wrong
      # direction when the real cause was a missing apt package.
      - name: Report press failures
        run: |
          echo "::error::The episode press step failed. See the 'Press all episodes' step log in the build job."
          echo "Failing dates still inside the backfill window are retried on the next scheduled run."
          exit 1
