name: build

# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
# Re-enable via Actions tab or: gh workflow enable build

on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * *'
  push:
    branches:
      - main

# A scheduled run and a push run both commit to main and deploy to gh-pages.
# Overlapping them races the push and loses episodes.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Shallow: nothing here reads history, and the archive is 2000+ posts deep.
      - uses: actions/checkout@v4

      - name: Set Date Env
        run: echo "TODAY=$(date +%F)" >> $GITHUB_ENV

      - name: Get ebook2cw latest commit hash
        id: ebook2cw-version
        run: |
          HASH=$(git ls-remote https://github.com/dj1yfk/ebook2cw.git HEAD | cut -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Cache ebook2cw binary
        id: cache-ebook2cw
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ebook2cw
          key: ebook2cw-${{ runner.os }}-${{ steps.ebook2cw-version.outputs.hash }}

      # Runtime packages are always needed. The toolchain and -dev headers are
      # only needed to compile ebook2cw, which is cached, so installing them on
      # every run cost ~a minute for nothing.
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            fortune espeak sox libsox-fmt-all libmp3lame0 libvorbisfile3

      - name: Install build dependencies
        if: steps.cache-ebook2cw.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install --assume-yes --no-install-recommends \
            build-essential gettext libvorbis-dev libmp3lame-dev

      - name: Build ebook2cw
        if: steps.cache-ebook2cw.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/dj1yfk/ebook2cw.git
          # Fix german translation error
          sed -i.bak 's/\(install .*-m 0644 po\/de.mo\)/#\1/' ebook2cw/Makefile
          sudo make --directory=ebook2cw/
          sudo make install --directory=ebook2cw/
          rm -rf ebook2cw

      - name: Press all episodes
        id: press
        continue-on-error: true
        env:
          S3_ACCESS: ${{ secrets.S3_ACCESS }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: ./episode_press.sh 05 10 15 20 25 30

      # Writes the true size/duration of every episode into post front matter.
      # Six HTTP requests total. Self-healing: any post still missing values,
      # including ones whose upload failed earlier, gets them once audio exists.
      - name: Backfill episode metadata
        run: ./backfill_metadata.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache Jekyll build
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-${{ runner.os }}-${{ hashFiles('_config.yml', '_includes/**', '_layouts/**') }}
          restore-keys: jekyll-${{ runner.os }}-

      - name: Build Jekyll site
        run: bundle exec jekyll build

      # Fails the run before deploying a feed clients would reject.
      - name: Verify feeds
        run: ./verify_feeds.py _site --sample 3

      # --global so it applies to the gh-pages checkout too, which is a
      # separate repo and does not inherit this one's local config.
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push new posts
        run: |
          git add _posts/*.md
          if ! git diff --staged --quiet; then
            git commit -m "Unattended build"
            git push origin main
          fi

      # Separate checkout rather than swapping branches in place: the old
      # approach ran `git clean -fdx` + `rm -rf *` over the working tree and
      # relied on a full clone. Jekyll ignores dot-directories, so this one is
      # not picked up by the build.
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      - name: Deploy to gh-pages
        working-directory: .gh-pages
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../_site/. .
          # Skip Jekyll processing on the Pages side; the site is already built.
          touch .nojekyll
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Deploy Jekyll site"
            git push origin gh-pages
          fi

      - name: Report upload failures
        if: steps.press.outcome == 'failure'
        run: |
          echo "::error::Some episode uploads failed. Check the job summary for details."
          echo "The workflow will retry failed uploads on the next scheduled run."
          exit 1
