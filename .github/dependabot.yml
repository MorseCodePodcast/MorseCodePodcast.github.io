# Without this, the SHA pins in build.yml and the Gemfile.lock silently rot:
# pinning is only safe if something is responsible for moving the pins.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      jekyll:
        patterns: ["*"]
